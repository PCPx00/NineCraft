[bees]
	#Bees the Random Bee Egg will never produce.
	#Each entry is matched against the bee id as a case insensitive substring.
	#Productive Bees ids look like productivebees:atm/starry, so an entry can be
	#as precise as "atm/starry" or as broad as "vibranium".
	#Leave the list empty to allow every bee.
	random_bee_egg_blocklist = ["atm/allthemodium", "atm/unobtainium", "atm/vibranium", "atm/starry", "atm/patrick", "atm/gregstar"]
