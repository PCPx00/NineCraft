#Use the dark theme for Grim Storage screens. Toggle it with the sun/moon button in any screen.
darkMode = true
#How solid the screen panels are, in percent. Lower lets more of the world show through.
# Default: 88
# Range: 40 ~ 100
panelOpacity = 88
#Soul Terminal: share one search with JEI. Typing in either one searches both.
terminalJeiSync = true
#Soul Terminal: put the cursor in the search box as soon as the terminal opens.
terminalFocusSearch = true
#Soul Terminal: keep what you searched for after closing the terminal.
terminalKeepSearch = true
#Soul Terminal height: AUTO fits the screen, NORMAL is 6 rows, TALL 9, TALLER 12.
#Allowed Values: AUTO, NORMAL, TALL, TALLER
terminalSize = "AUTO"
#Show a toast when a craft you ordered finishes, or has been stuck for a minute.
craftAlerts = true
#Soul Terminal: items pinned to the top of the list (Alt-click an item to pin or unpin it).
pinnedItems = []
